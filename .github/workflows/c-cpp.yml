name: C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install compiler
      run: sudo apt-get update && sudo apt-get install -y g++

    - name: Build
      run: g++ -std=c++17 -O2 -pthread main.cpp -o lab2

    - name: Run
      run: ./lab2
